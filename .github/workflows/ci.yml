name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pip-audit

      - name: Audit dependencies
        run: pip-audit -r requirements.txt

      - name: Import check
        env:
          DATABASE_URL: postgresql+asyncpg://ci:ci@localhost/ci
          JWT_SECRET: ci-dummy
        run: python -c "from app.main import app; print('Backend import OK')"

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://ci:ci@localhost/ci
          JWT_SECRET: ci-dummy
        run: python -m pytest tests/ -v --tb=short

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test --if-present

  mcp-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp/
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mcp/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pip-audit

      - name: Audit dependencies
        run: pip-audit -r requirements.txt

      - name: Compile server
        run: python -m py_compile server.py

      - name: Verify fail-closed configuration
        env:
          NODEBYTE_API_TOKEN: nb_pat_ci_dummy
        run: |
          if python server.py 2>error.log; then
            echo "MCP server unexpectedly started without MCP_TOKEN"
            exit 1
          fi
          grep -q "MCP_TOKEN is not set" error.log

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate production Compose definition
        env:
          POSTGRES_PASSWORD: ci-dummy-password
          FRONTEND_ORIGIN: https://nodebyte.example.com
          JWT_SECRET: ci-dummy-jwt-secret
          TURNSTILE_SECRET_KEY: ci-dummy-turnstile-secret
          NEXT_PUBLIC_API_BASE_URL: https://nodebyte.example.com/api
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ci-dummy-turnstile-site-key
        run: docker compose -f docker-compose.prod.yml config --quiet

      - uses: docker/setup-buildx-action@v4

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build production backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: false
          load: true
          tags: nodebyte-backend:ci
          cache-from: type=gha,scope=backend-prod
          cache-to: type=gha,mode=max,scope=backend-prod

      - name: Build production frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: false
          load: true
          tags: nodebyte-frontend:ci
          cache-from: type=gha,scope=frontend-prod
          cache-to: type=gha,mode=max,scope=frontend-prod

      - name: Build MCP image
        uses: docker/build-push-action@v7
        with:
          context: ./mcp
          push: false
          load: true
          tags: nodebyte-mcp:ci
          cache-from: type=gha,scope=mcp
          cache-to: type=gha,mode=max,scope=mcp

      - name: Verify production image permissions
        run: |
          test "$(docker run --rm --entrypoint id nodebyte-backend:ci -u)" != "0"
          test "$(docker run --rm --entrypoint id nodebyte-frontend:ci -u)" != "0"
          docker run --rm --entrypoint sh nodebyte-frontend:ci -c \
            'test -w /app/.next/server/app && touch /app/.next/server/app/.write-test && rm /app/.next/server/app/.write-test'
          test "$(docker run --rm --entrypoint id nodebyte-mcp:ci -u)" != "0"
          docker run --rm --entrypoint sh nodebyte-mcp:ci -c 'test -r /app/server.py'
